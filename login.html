<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – IAnnonce</title>
  <meta name="theme-color" content="#2563eb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #06b6d4;
      --dark: #0f172a;
      --gray: #64748b;
      --gray-light: #94a3b8;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
      --radius: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header simple */
    .top-bar {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .logo span {
      color: var(--dark);
    }

    .back-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--gray);
      transition: color var(--transition);
    }
    .back-link:hover {
      color: var(--primary);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 60px;
    }

    .login-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .login-card .subtitle {
      text-align: center;
      color: var(--gray);
      font-size: 0.975rem;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--dark);
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.975rem;
      font-family: inherit;
      color: var(--dark);
      background: white;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    input::placeholder {
      color: #94a3b8;
    }

    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 48px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--gray);
      padding: 4px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      cursor: pointer;
    }
    .remember input {
      width: auto;
      accent-color: var(--primary);
    }

    .forgot {
      color: var(--primary);
      font-weight: 500;
      transition: color var(--transition);
    }
    .forgot:hover {
      color: var(--primary-hover);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.32);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      color: var(--gray-light);
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-secondary {
      background: white;
      color: var(--dark);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg);
    }

    .signup {
      text-align: center;
      margin-top: 28px;
      font-size: 0.95rem;
      color: var(--gray);
    }
    .signup a {
      color: var(--primary);
      font-weight: 600;
    }
    .signup a:hover {
      text-decoration: underline;
    }

    /* Demo note */
    .demo-note {
      margin-top: 24px;
      padding: 12px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #1e40af;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
      .top-bar {
        padding: 16px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="logo">IA<span>nnonce</span></a>
    <a href="index.html" class="back-link">← Retour</a>
  </div>

  <main class="main">
    <div class="login-card">
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à votre espace IAnnonce</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="vous@email.com" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Afficher le mot de passe">
              👁️
            </button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            Se souvenir de moi
          </label>
          <a href="#" class="forgot">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn btn-primary">
          Se connecter
        </button>
      </form>

      <div class="divider">ou</div>

      

      <p class="signup">
     Pas encore de compte ? <a href="register.html">Créer un compte</a>
      </p>

      <div class="demo-note">
        Mode démo : cliquez sur « Continuer en mode démo » pour accéder au dashboard
      </div>
    </div>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

async function handleLogin(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Email ou mot de passe incorrect.");
    return;
  }

  window.location.href = "dashboard.html";
}
  </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

  
</body>
</html>
